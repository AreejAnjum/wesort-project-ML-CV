[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trashnet-vit"
version = "0.1.0"
description = "Reproducible self-supervised Vision Transformer pipeline for TrashNet"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pillow>=10",
  "pyyaml>=6",
  "scikit-learn>=1.3",
  "timm>=1.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

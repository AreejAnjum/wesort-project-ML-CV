[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trashnet-unsupervised-vit"
version = "0.1.0"
description = "DINOv2 and MAE unsupervised learning and fine-tuning on TrashNet"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pillow>=10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.40",
]
